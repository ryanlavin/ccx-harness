<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; }
  body {
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    background:
      radial-gradient(900px 600px at 22% 18%, rgba(255,138,91,0.10) 0%, rgba(255,138,91,0) 60%),
      radial-gradient(900px 600px at 85% 95%, rgba(126,224,201,0.10) 0%, rgba(126,224,201,0) 55%),
      linear-gradient(155deg, #11161f 0%, #0b0e14 100%);
    color: #e6edf3;
    display: flex; flex-direction: column; justify-content: center;
    padding: 92px 96px;
    position: relative; overflow: hidden;
  }
  .wordmark {
    font-family: "SF Mono", "Menlo", monospace;
    font-size: 28px; letter-spacing: 1.5px; color: #7ee0c9; font-weight: 600;
    margin-bottom: 30px; display: flex; align-items: center; gap: 14px;
  }
  .wordmark .dot { width: 11px; height: 11px; border-radius: 50%; background: #7ee0c9; box-shadow: 0 0 16px #7ee0c9; }
  .tagline { font-size: 104px; font-weight: 800; letter-spacing: -2.5px; line-height: 1.0; }
  .tagline .verb { color: #ff8a5b; }
  .sub { margin-top: 34px; font-size: 31px; color: #93a1b3; font-weight: 500; max-width: 940px; line-height: 1.3; }
  .flow {
    position: absolute; bottom: 64px; left: 96px;
    font-family: "SF Mono", "Menlo", monospace; font-size: 21px; color: #5f6b7d; letter-spacing: 0.5px;
  }
  .flow b { color: #c9d4e0; font-weight: 600; }
  .flow .arrow { color: #3f4858; margin: 0 10px; }
</style></head>
<body>
  <div class="wordmark"><span class="dot"></span>ccx-harness</div>
  <div class="tagline">Claude <span class="verb">conducts</span> Codex.</div>
  <div class="sub">Plan with Claude, build with Codex, and nothing merges without two independent reviewers agreeing.</div>
  <div class="flow"><b>plan</b><span class="arrow">→</span><b>dispatch</b><span class="arrow">→</span><b>PR</b><span class="arrow">→</span><b>2 reviewers</b><span class="arrow">→</span><b>auto-merge</b></div>
</body></html>
